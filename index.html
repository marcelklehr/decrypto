<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

    <link rel="stylesheet" href="decrypto.css">

    <script src="decrypto.js"></script>

    <title>Decrypto</title>
  </head>
  <body class="bg-dark">
    <div class="container-fluid my-5">
      <div class="container-fluid">
        <div class="row">
          <div class="col-8 bg-info">
            <p><h3>Decrypto</h3></p>
          </div>
          <div class="col-4">
            <button type="button" class="btn btn-lg btn-primary align-baseline float-right my-3" id="newGameButton" onclick="openModal('newGameModal')">
              New Game
            </button>
          </div>
        </div>
      </div>
      <div class="container-fluid my-5">
        <div class="row">
          <div class="col-sm-3">
            <div class="card">
              <div class="card-header bg-primary">
                <div class="cluenumber">
                  1
                </div>
              </div>
              <div class="body">
                <div class="cluebody" id="word0">
                  ?
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-3">
            <div class="card">
              <div class="card-header bg-primary">
                <div class="cluenumber">
                  2
                </div>
              </div>
              <div class="body">
                <div class="cluebody" id="word1">
                  ?
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-3">
            <div class="card">
              <div class="card-header bg-primary">
                <div class="cluenumber">
                  3
                </div>
              </div>
              <div class="body">
                <div class="cluebody" id="word2">
                  ?
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-3">
            <div class="card">
              <div class="card-header bg-primary">
                <div class="cluenumber">
                  4
                </div>
              </div>
              <div class="body">
                <div class="cluebody" id="word3">
                  ?
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="container-fluid">
        <div class="row">
          <div class="col-6">
            <div class="float-left">
            <div class="dropdown">              
              <button class="btn btn-primary btn-lg dropdown-toggle my-3" type="button" id="dropdownMenuButton" onclick="toggleDropdown(event)" aria-haspopup="true" aria-expanded="false">
                Code
              </button>
              <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                <a class="dropdown-item" href="#" onclick="openModal('codeModal'); return false;" id="revealCodeButton" style="display:none">Reveal code</a>
                <a class="dropdown-item" href="#" onclick="generateCode(); return false;">Generate new code</a>
              </div>
            </div>
          </div>
        </div>
          <div class="col-6">
            <div class="float-right">
              <button class="btn btn-primary btn-lg my-3" type="button" id="fullScreenButton" onclick="toggleFullScreen()">
                <svg class="icon" id="enableFullScreen" viewBox="0 0 448 512" aria-hidden="true"><path d="M32 32C14.3 32 0 46.3 0 64v96c0 17.7 14.3 32 32 32s32-14.3 32-32V96h64c17.7 0 32-14.3 32-32s-14.3-32-32-32H32zM64 352c0-17.7-14.3-32-32-32s-32 14.3-32 32v96c0 17.7 14.3 32 32 32h96c17.7 0 32-14.3 32-32s-14.3-32-32-32H64V352zM320 32c-17.7 0-32 14.3-32 32s14.3 32 32 32h64v64c0 17.7 14.3 32 32 32s32-14.3 32-32V64c0-17.7-14.3-32-32-32H320zM448 352c0-17.7-14.3-32-32-32s-32 14.3-32 32v64H320c-17.7 0-32 14.3-32 32s14.3 32 32 32h96c17.7 0 32-14.3 32-32V352z"/></svg>
                <svg class="icon" id="disableFullScreen" viewBox="0 0 448 512" aria-hidden="true" style="display:none"><path d="M160 64c0-17.7-14.3-32-32-32S96 46.3 96 64l0 64-64 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l96 0c17.7 0 32-14.3 32-32l0-96zM32 320c-17.7 0-32 14.3-32 32s14.3 32 32 32l64 0 0 64c0 17.7 14.3 32 32 32s32-14.3 32-32l0-96c0-17.7-14.3-32-32-32l-96 0zM352 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 96c0 17.7 14.3 32 32 32l96 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-64 0 0-64zM320 320c-17.7 0-32 14.3-32 32l0 96c0 17.7 14.3 32 32 32s32-14.3 32-32l0-64 64 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0z"/></svg>
              </button>
            </div>
          </div>
        </div>
        </div>
      </div>

<!-- Modal -->
      <div class="modal" id="newGameModal" tabindex="-1" role="dialog" aria-labelledby="newGameModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="newGameModalLabel">New Game</h5>
        <button type="button" class="close" onclick="closeModal('newGameModal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        Do you want to start a new game?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('newGameModal')" id="newGameModalCancelButton">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="closeModal('newGameModal'); startNewGame()">Start New Game</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
      <div class="modal" id="disableScreenLockModal" tabindex="-1" role="dialog" aria-labelledby="disableScreenLockModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="disableScreenLockModalLabel">Disable Screen Lock?</h5>
        <button type="button" class="close" onclick="closeModal('disableScreenLockModal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        Do you want to keep the screen on while the game is in progress?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('disableScreenLockModal')">No</button>
        <button type="button" class="btn btn-primary" onclick="closeModal('disableScreenLockModal'); disableScreenLock()">Yes (recommended)</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
      <div class="modal" id="codeModal" tabindex="-1" role="dialog" aria-labelledby="codeModalCenterTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="codeModalLongTitle">Code</h5>
        <button type="button" class="close" onclick="closeModal('codeModal')" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="container-fluid">
          <div class="row">
            <div class="col-4">
              <div class="card">
                <div class="body">
                  <div class="codebody bg-info" id="code0">
                  </div>
                </div>                
              </div>
            </div>            
            <div class="col-4">
              <div class="card">
                <div class="body">
                  <div class="codebody bg-info" id="code1">
                  </div>
                </div>
              </div>
            </div>
            <div class="col-4">
              <div class="card">
                <div class="body">
                  <div class="codebody bg-info" id="code2">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('codeModal')">Close</button>
      </div>
    </div>
  </div>
</div>
    <script>
      document.addEventListener('DOMContentLoaded', initialize);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

    <link rel="stylesheet" href="decrypto.css">

    <script src="decrypto.js"></script>

    <title>Decrypto</title>
  </head>
  <body class="bg-dark">
    <div class="container-fluid my-5">
      <div class="container-fluid">
        <div class="row">
          <div class="col-8 bg-info">
            <p><h3>Decrypto</h3></p>
          </div>
          <div class="col-4">
            <button type="button" class="btn btn-lg btn-primary align-baseline float-right my-3" onclick="openModal('newGameModal')">
              New Game
            </button>
          </div>
        </div>
      </div>
      <div class="container-fluid my-5">
        <div class="row">
          <div class="col-sm-3">
            <div class="card">
              <div class="card-header bg-primary">
                <div class="cluenumber">
                  1
                </div>
              </div>
              <div class="body">
                <div class="cluebody" id="word0">
                  ?
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-3">
            <div class="card">
              <div class="card-header bg-primary">
                <div class="cluenumber">
                  2
                </div>
              </div>
              <div class="body">
                <div class="cluebody" id="word1">
                  ?
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-3">
            <div class="card">
              <div class="card-header bg-primary">
                <div class="cluenumber">
                  3
                </div>
              </div>
              <div class="body">
                <div class="cluebody" id="word2">
                  ?
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-3">
            <div class="card">
              <div class="card-header bg-primary">
                <div class="cluenumber">
                  4
                </div>
              </div>
              <div class="body">
                <div class="cluebody" id="word3">
                  ?
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="container-fluid">
        <div class="row">
          <div class="col-6">
            <div class="float-left">
            <div class="dropdown">              
              <button class="btn btn-primary btn-lg dropdown-toggle my-3" type="button" id="dropdownMenuButton" onclick="toggleDropdown(event)" aria-haspopup="true" aria-expanded="false">
                Code
              </button>
              <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                <a class="dropdown-item" href="#" onclick="openModal('codeModal'); return false;" id="revealCodeButton" style="display:none">Reveal code</a>
                <a class="dropdown-item" href="#" onclick="generateCode(); return false;">Generate new code</a>
              </div>
            </div>
          </div>
        </div>
          <div class="col-6">
            <div class="float-right">
              <button class="btn btn-primary btn-lg my-3" type="button" id="fullScreenButton" onclick="toggleFullScreen()">
                <svg class="icon" id="enableFullScreen" viewBox="0 0 448 512" aria-hidden="true"><path d="M448 344v112c0 13.3-10.7 24-24 24h-112c-21.4 0-32.1-25.9-17-41l36.2-36.2L224 295.6l-107 107V392c0 21.5-28.7 32.1-41 17L32 344c-9.4-9.4-9.4-24.6 0-33.9l89.5-89.5c15.7-15.7 41-4.5 41 17v75.4l107-107L295.6 224l-75.4 75.4c-21.5 15.7-41-4.5-41-17V56c0-13.3 10.7-24 24-24h112c13.3 0 24 10.7 24 24v112c0 21.4-25.9 32.1-41 17l-36.2-36.2L224 216.4l107 107V248c0-21.5 28.7-32.1 41-17l89.5 89.5c9.4 9.4 9.4 24.6 0 33.9L392 443.4c-15.7 15.7-41 4.5-41-17v-75.4l-107 107L152.4 288l75.4-75.4c21.5-15.7 41 4.5 41 17V456c0 13.3-10.7 24-24 24H56c-13.3 0-24-10.7-24-24V344c0-21.4 25.9-32.1 41-17l36.2 36.2L216.4 288l-107-107v75.4c0 21.5-28.7 32.1-41 17L-21.5 183.9c-9.4-9.4-9.4-24.6 0-33.9L55.6 72.8c15.7-15.7 41-4.5 41 17v75.4l107-107L288 88.4l75.4 75.4c15.7 21.5-4.5 41-17 41h-75.4l107 107V192c0-13.3 10.7-24 24-24h112c13.3 0 24 10.7 24 24z"/></svg>
                <svg class="icon" id="disableFullScreen" viewBox="0 0 448 512" aria-hidden="true" style="display:none"><path d="M0 180V56c0-13.3 10.7-24 24-24h112c21.4 0 32.1 25.9 17 41l-36.2 36.2L224 215.6l107-107V32c0-21.5 28.7-32.1 41-17l89.5 89.5c9.4 9.4 9.4 24.6 0 33.9L392 227.8c-15.7 15.7-41 4.5-41-17V124.4l-107 107L152.4 288l75.4-75.4c21.5-15.7 41 4.5 41 17V200c0 13.3-10.7 24-24 24H56c-13.3 0-24-10.7-24-24z"/></svg>
              </button>
            </div>
          </div>
        </div>
        </div>
      </div>

<!-- Modal -->
      <div class="modal" id="newGameModal" tabindex="-1" role="dialog" aria-labelledby="newGameModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="newGameModalLabel">New Game</h5>
        <button type="button" class="close" onclick="closeModal('newGameModal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        Do you want to start a new game?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('newGameModal')" id="newGameModalCancelButton">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="closeModal('newGameModal'); startNewGame()">Start New Game</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
      <div class="modal" id="disableScreenLockModal" tabindex="-1" role="dialog" aria-labelledby="disableScreenLockModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="disableScreenLockModalLabel">Disable Screen Lock?</h5>
        <button type="button" class="close" onclick="closeModal('disableScreenLockModal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        Do you want to keep the screen on while the game is in progress?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('disableScreenLockModal')">No</button>
        <button type="button" class="btn btn-primary" onclick="closeModal('disableScreenLockModal'); disableScreenLock()">Yes (recommended)</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
      <div class="modal" id="codeModal" tabindex="-1" role="dialog" aria-labelledby="codeModalCenterTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="codeModalLongTitle">Code</h5>
        <button type="button" class="close" onclick="closeModal('codeModal')" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="container-fluid">
          <div class="row">
            <div class="col-4">
              <div class="card">
                <div class="body">
                  <div class="codebody bg-info" id="code0">
                  </div>
                </div>                
              </div>
            </div>            
            <div class="col-4">
              <div class="card">
                <div class="body">
                  <div class="codebody bg-info" id="code1">
                  </div>
                </div>
              </div>
            </div>
            <div class="col-4">
              <div class="card">
                <div class="body">
                  <div class="codebody bg-info" id="code2">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('codeModal')">Close</button>
      </div>
    </div>
  </div>
</div>
    <script>
      document.addEventListener('DOMContentLoaded', initialize);
    </script>
  </body>
</html>
